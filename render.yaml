services:
  - type: web
    name: quotetext-backend
    runtime: node
    region: oregon
    repo: https://github.com/chideraezeudu2-sudo/quotetext-backend
    branch: main
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PORT
        value: 3000